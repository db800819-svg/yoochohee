<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>M1 TFT</title>
<meta name="description" content="마우스를 따라 움직이는 3D 에셋 랜딩 페이지" />
<link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="backdrop__grid"></div>
    <div class="backdrop__glow backdrop__glow--a"></div>
    <div class="backdrop__glow backdrop__glow--b"></div>
  </div>

  <header class="topbar">
    <span class="topbar__name">M1 TFT</span>
  </header>

  <div class="stage" id="stage">
    <!-- 바닥 그림자: 에셋과 반대로 움직여 공중에 떠 있는 느낌을 만든다 -->
    <div class="shadow" id="shadow" aria-hidden="true"></div>

    <div class="floaty" id="floaty">
      <div class="asset" id="asset-wrap">
        <img id="asset" alt="3D 에셋" />
        <!-- 표면 하이라이트: 에셋 실루엣으로 마스킹돼 마우스 방향에서 빛이 든다 -->
        <div class="sheen" id="sheen" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <main class="hero">
    <p class="hero__eyebrow">Interactive 3D</p>
    <h1 class="hero__title">마우스를 움직여 보세요</h1>
    <p class="hero__sub">커서를 따라 기울고, 가만히 두면 천천히 떠다닙니다.</p>
  </main>

  <p class="notice" id="notice" hidden></p>

  <script src="./app.js"></script>
</body>
</html>
