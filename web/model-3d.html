<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>M1 TFT</title>
<link rel="stylesheet" href="./style.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="bg-glow" aria-hidden="true"></div>

  <canvas id="scene"></canvas>

  <main class="overlay">
    <p class="eyebrow">TRIPO × THREE.JS</p>
    <h1>마우스를 움직여 보세요</h1>
    <p class="sub">에셋이 커서를 따라 기울고, 가만히 두면 천천히 떠다닙니다.</p>
  </main>

  <div id="loader" class="loader">
    <div class="loader__bar"><span id="loader-fill"></span></div>
    <p id="loader-text">모델 불러오는 중…</p>
  </div>

  <p id="hint" class="hint" hidden></p>

  <script type="module" src="./main.js"></script>
</body>
</html>
